name: Clean Caches

on:
  workflow_dispatch:

jobs:
  clean-caches:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    
    steps:     
      - name: Delete Action Caches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let totalDeleted = 0;
            
            const caches = await github.rest.actions.getActionsCacheList({
              owner,
              repo,
              per_page: 100
            });
            
            for (const cache of caches.data.actions_caches) {
              if (cache.key.startsWith('ccache-') || cache.key.startsWith('lto-cache-')) {
                console.log(`Deleting cache key: ${cache.key}`);
                await github.rest.actions.deleteActionsCacheById({
                  owner,
                  repo,
                  cache_id: cache.id
                });
                totalDeleted++;
              }
            }
            
            return `Successfully deleted ${totalDeleted} caches.`;

      - name: Environment Reset
        run: |
          rm -rf $HOME/.ccache/*
          sudo apt-get clean
          sudo journalctl --vacuum-time=1s
          sudo rm -rf /var/log/*
          docker system prune -af || true
          sudo rm -rf /tmp/*
          echo "Environment reset complete!"
          echo "Disk space summary:"
          df -h
